const fmt=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'});function renderHomeProgress(){const s=IELTI.summary(),progress=Math.min(100,(s.day/182)*100),phonics=IELTI.getPhonics?IELTI.getPhonics():(()=>{try{return JSON.parse(localStorage.getItem('ielti_phonics_121_v1'))||{learned:[]}}catch{return{learned:[]}}})();document.getElementById('date').textContent=fmt.format(new Date());document.getElementById('dayRing').textContent='Day '+s.day;document.getElementById('studyProgress').style.setProperty('--study-progress',progress+'%');document.getElementById('studyProgress').setAttribute('aria-valuenow',String(Math.min(182,s.day)));document.getElementById('week').textContent='第 '+s.week+' 周';document.getElementById('due').textContent=s.due+' 个到期';document.getElementById('mastered').textContent=(s.coreMastered+s.classMastered)+' 个掌握';document.getElementById('phonicsLearned').textContent=(Array.isArray(phonics.learned)?phonics.learned.length:0)+' 个已学';document.getElementById('courseText').textContent='已完成 '+s.completed+' 项课程，继续今天的计划';document.getElementById('heroTitle').textContent=s.due?'先复习 '+s.due+' 个到期单词':'今天没有积压，学习新内容吧';document.getElementById('heroText').textContent='当前是计划第 '+s.day+' 天 · 第 '+s.week+' 周；今日已复习 '+s.today.reviews+' 次。'}renderHomeProgress();window.addEventListener('ielti-progress',renderHomeProgress);
const backupStatus=document.getElementById('backupStatus'),importAllFile=document.getElementById('importAllFile');document.getElementById('exportAllBtn').onclick=()=>{const count=IELTI.backup.export();backupStatus.textContent='已导出 '+count+' 项学习数据。请妥善保存备份文件。'};document.getElementById('importAllBtn').onclick=()=>importAllFile.click();importAllFile.onchange=async()=>{const file=importAllFile.files[0];importAllFile.value='';if(!file)return;if(!confirm('恢复备份会覆盖此浏览器中的学习进度，是否继续？'))return;try{const count=await IELTI.backup.import(file);backupStatus.textContent='已恢复 '+count+' 项学习数据，正在刷新…';location.reload()}catch(error){backupStatus.textContent='恢复失败：'+error.message}};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
