<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>分类词汇例句检查</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f5f7;--panel:#fff;--text:#17191c;--muted:#687078;--line:#dfe3e6;--green:#176a54;--soft:#eef6f2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;letter-spacing:0}
    main{width:min(920px,calc(100% - 28px));margin:32px auto 64px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}
    h1{margin:0;font-size:28px;line-height:1.2}header p{margin:7px 0 0;color:var(--muted)}.count{flex:none;color:var(--green);font-size:15px;font-weight:700}
    .list{display:grid;gap:10px}.item{display:grid;grid-template-columns:72px 1fr;gap:18px;padding:18px 20px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
    .index{color:var(--muted);font-size:13px}.word{margin-top:3px;font-size:20px;font-weight:700}.example{margin:0;font-size:16px;line-height:1.55}.translation{margin:6px 0 0;color:var(--muted);line-height:1.55}.split{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);color:var(--green);font-size:13px;line-height:1.5}
    @media(max-width:600px){main{margin-top:20px}.item{grid-template-columns:1fr;gap:10px;padding:16px}.index{display:inline;margin-right:8px}.word{display:inline}header{align-items:start}.count{margin-top:5px}}
    @media(prefers-color-scheme:dark){:root{--bg:#141719;--panel:#1e2225;--text:#f2f4f5;--muted:#aab2b7;--line:#363c40;--green:#71c8a9;--soft:#1d302a}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>第五天 · 动作词</h1><p>例句、翻译与记忆提示</p></div><div class="count">30 个</div></header>
    <section class="list" id="list"></section>
  </main>
  <script src="ielts-vocab-learning-notes.js?v=20260802-22"></script>
  <script>
    const words=['action','let','do','use','blow','nod','shake','see','look','watch','notice','guess','suppose','listen','hear','lead','feel','sound','read','shout','go','taste','smell','kiss','pull','push','rush','touch','glue','point'];
    const notes=window.IELTI_CATEGORY_LEARNING_NOTES||{};
    const escapeHtml=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    document.getElementById('list').innerHTML=words.map((word,index)=>{const note=notes[`第五天|动作|${word}`]||{};return `<article class="item"><div><span class="index">${String(index+1).padStart(2,'0')}</span><div class="word">${escapeHtml(word)}</div></div><div><p class="example">${escapeHtml(note.example)}</p><p class="translation">${escapeHtml(note.translation)}</p><p class="split">${escapeHtml(note.split)}</p></div></article>`}).join('');
  </script>
</body>
</html>
