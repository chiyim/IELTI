  function reviewDeck(){return state.learned.length?all.filter(item=>state.learned.includes(item.id)):all.slice(0,12)}
  function renderReview(){const deck=reviewDeck();if(!deck.length){$('reviewShell').innerHTML='<div class="empty">先学习几个组合，再回来复习。</div>';return}reviewIndex%=deck.length;$('reviewShell').innerHTML=cardMarkup(deck[reviewIndex],'复习',reviewIndex,deck.length)}
  function nextQuiz(){const answer=all[Math.floor(Math.random()*all.length)],pool=[answer];while(pool.length<4){const option=all[Math.floor(Math.random()*all.length)];if(!pool.some(x=>x.id===option.id)&&option.ipa!==answer.ipa)pool.push(option)}pool.sort(()=>Math.random()-.5);currentQuiz={answer,locked:false};$('quizBox').innerHTML=`<div class="quiz-prompt">哪个字母组合能拼出这个单词中的 <b>${answer.ipa}</b>？</div><div class="quiz-word">${answer.word}</div><button class="sound-btn" style="position:static;margin:10px auto" data-speak="${answer.word}" aria-label="播放 ${answer.word}">▶</button><div class="quiz-choices">${pool.map(item=>`<button class="quiz-choice" data-answer="${item.id}">${item.grapheme}</button>`).join('')}</div><div class="quiz-feedback" id="quizFeedback" role="status" aria-live="polite">选择一个答案</div><button class="hero-btn next-quiz" data-next-quiz hidden>下一题</button>`}
  function setMode(mode){document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));document.querySelectorAll('.panel').forEach(panel=>panel.classList.remove('active'));$(`${mode}Panel`).classList.add('active');if(mode==='study')renderStudy();if(mode==='review')renderReview();if(mode==='quiz')nextQuiz()}
  const ipaUrl=file=>file.startsWith('http')?file:IPA_AUDIO_BASE+file;
  async function cacheIpaAudio(){if(!('caches'in window)||!navigator.onLine)return;const files=[...new Set(Object.values(IPA_AUDIO).flat())],cache=await caches.open('ielti-ipa-audio-v3');await Promise.all(files.map(async file=>{const url=ipaUrl(file);if(await cache.match(url))return;try{const response=await fetch(url,{mode:'no-cors'});if(response.ok||response.type==='opaque')await cache.put(url,response)}catch{}}))}
  function playIpa(ipa,button){if(activeIpaAudio){activeIpaAudio.pause();activeIpaAudio=null}const files=IPA_AUDIO[ipa]||[],playAt=index=>{if(index>=files.length){button.classList.remove('is-playing');activeIpaAudio=null;return}const audio=new Audio(ipaUrl(files[index]));activeIpaAudio=audio;button.classList.add('is-playing');audio.addEventListener('ended',()=>playAt(index+1),{once:true});audio.addEventListener('error',()=>{button.classList.remove('is-playing');activeIpaAudio=null},{once:true});audio.play().catch(()=>{button.classList.remove('is-playing');activeIpaAudio=null})};playAt(0)}
  document.addEventListener('click',event=>{const mode=event.target.closest('[data-mode],[data-mode-target]');if(mode){setMode(mode.dataset.mode||mode.dataset.modeTarget);return}if(event.target.closest('[data-next-quiz]')){nextQuiz();return}const filter=event.target.closest('[data-type]');if(filter){activeType=filter.dataset.type;renderFilters();renderLibrary();return}const ipaAudio=event.target.closest('[data-ipa]');if(ipaAudio){playIpa(ipaAudio.dataset.ipa,ipaAudio);return}const audio=event.target.closest('[data-speak]');if(audio){speak(audio.dataset.speak,audio);return}const learn=event.target.closest('[data-learn]');if(learn){const id=learn.dataset.learn;state.learned=state.learned.includes(id)?state.learned.filter(x=>x!==id):[...state.learned,id];save();learn.classList.toggle('done');return}const rate=event.target.closest('[data-rate]');if(rate){const panel=rate.closest('.panel').id;if(panel==='studyPanel'){const item=all[studyIndex%all.length];if(rate.dataset.rate==='known'&&!state.learned.includes(item.id))state.learned.push(item.id);studyIndex++;save();renderStudy()}else{reviewIndex++;renderReview()}return}const choice=event.target.closest('[data-answer]');if(choice&&!currentQuiz.locked){currentQuiz.locked=true;state.quiz.total++;const right=choice.dataset.answer===currentQuiz.answer.id;if(right){state.quiz.right++;choice.classList.add('correct');$('quizFeedback').textContent='答对了！'}else{choice.classList.add('wrong');document.querySelector(`[data-answer="${currentQuiz.answer.id}"]`).classList.add('correct');$('quizFeedback').textContent=`正确答案是 ${currentQuiz.answer.grapheme}`};document.querySelector('[data-next-quiz]').hidden=false;save()}});
  window.addEventListener('ielti-progress',applySyncedState);
  renderFilters();renderLibrary();renderStudy();renderReview();nextQuiz();updateStats();cacheIpaAudio();
  if(all.length!==121)console.warn('Expected 121 graphemes, got',all.length);
  </script>
</body>
