<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.png" type="image/png"><link rel="apple-touch-icon" href="icon.png">
  <title>课程播放器 · IELTI</title>
  <script>document.documentElement.classList.add('ielti-booting');try{var m=localStorage.getItem('ielti_display_mode_v1')||localStorage.getItem('ielti_theme_v1')||(new Date().getHours()>=19||new Date().getHours()<7?'dark':'light');if(['light','dark','eink'].indexOf(m)>-1){document.documentElement.dataset.display=m;document.documentElement.dataset.theme=m==='dark'?'dark':'light';document.documentElement.classList.toggle('eink-mode',m==='eink');}}catch(e){}</script>
  <link rel="stylesheet" href="apple-ui.css?v=20260805-37"><link rel="stylesheet" href="eink-ui.css?v=20260728-5">
  <style>
    body{margin:0;min-height:100dvh;background:var(--apple-bg);color:var(--apple-ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.player-wrap{width:min(1120px,100%);margin:auto;padding:clamp(1rem,4vw,2.5rem)}.back{display:inline-flex;margin-bottom:1.1rem;color:var(--apple-blue);text-decoration:none;font-size:.9rem;font-weight:700}.kicker{margin:0 0 .35rem;color:var(--apple-blue);font-size:.72rem;font-weight:850;letter-spacing:.14em}.title{margin:0;font-size:clamp(1.4rem,4vw,2.35rem);letter-spacing:-.035em;line-height:1.13}.video-shell{margin-top:1rem;overflow:hidden;border:1px solid var(--apple-line);border-radius:1.4rem;background:#000;box-shadow:var(--apple-shadow)}video{display:block;width:100%;max-height:calc(100dvh - 13rem);background:#000}.status{margin:.85rem 0 0;color:var(--apple-secondary);font-size:.84rem}.status b{color:var(--apple-ink)}.error{padding:2rem;color:#fff;text-align:center}.error a{color:#8ec9ff}.complete{color:#248a58;font-weight:750}@media(max-width:760px){.player-wrap{padding:.8rem}.video-shell{border-radius:1rem}video{max-height:calc(100dvh - 10rem)}}
  </style>
</head>
<body class="apple-ui"><main class="player-wrap"><a class="back" id="backLink" href="ielts-roadmap.html">← 返回课程路线</a><p class="kicker">IELTI COURSE PLAYER</p><h1 class="title" id="title">课程视频</h1><div class="video-shell" id="shell"><video id="video" controls playsinline preload="metadata"></video></div><p class="status" id="status">正在准备视频，播放后将自动记录实际观看时长。</p></main>
<script src="ielti-config.js?v=20260728-5"></script><script src="ielti-core.js?v=20260814-50"></script><script>
const params=new URLSearchParams(location.search),src=params.get('src'),title=params.get('title')||'课程视频',courseId=params.get('id')||'',expectedDuration=Math.max(0,Number(params.get('duration'))||0),video=document.getElementById('video'),status=document.getElementById('status'),WATCH_KEY='ielti_video_watch_v1';document.getElementById('title').textContent=title;try{const returnUrl=new URL(params.get('return')||'',location.href);if(['https:','http:','file:'].includes(returnUrl.protocol))document.getElementById('backLink').href=returnUrl.href}catch(e){}
let watched=0,pending=0,lastMediaTime=null,lastFlushAt=Date.now(),completed=false;
function readWatch(){try{return JSON.parse(localStorage.getItem(WATCH_KEY))||{}}catch(e){return{}}}
function saveWatch(position){if(!courseId)return;const all=readWatch(),entry=all[courseId]||{};entry.watched=Math.max(0,watched);entry.position=Math.max(0,Number(position)||0);entry.updatedAt=new Date().toISOString();all[courseId]=entry;localStorage.setItem(WATCH_KEY,JSON.stringify(all))}
function formatTime(seconds){const value=Math.max(0,Math.round(seconds||0)),m=Math.floor(value/60),s=value%60;return m+':'+String(s).padStart(2,'0')}
function targetDuration(){const duration=Number.isFinite(video.duration)?video.duration:expectedDuration;return duration>0?duration:0}
function renderStatus(){const target=targetDuration(),percent=target?Math.min(100,Math.round(watched/target*100)):0;if(completed){status.className='status complete';status.textContent='已完成课程并自动打卡 · 实际观看 '+formatTime(watched);return}status.className='status';status.textContent='已观看 '+formatTime(watched)+(target?' · '+percent+'% · 达到 90% 后自动完成':' · 播放后自动记录实际时长')}
function flush(force){const seconds=Math.floor(pending);if(seconds>0){window.IELTI?.recordStudySeconds(seconds,'video');pending-=seconds}if(force||Date.now()-lastFlushAt>=15000){saveWatch(video.currentTime);lastFlushAt=Date.now()}renderStatus()}
function completeIfReady(force){const target=targetDuration();if(completed||!courseId||!target||(!force&&watched<target*.9))return;completed=true;window.IELTI?.completeCourseVideo(courseId);saveWatch(video.currentTime);renderStatus()}
if(!src){document.getElementById('shell').innerHTML='<div class="error">没有找到视频地址。<br><a href="ielts-roadmap.html">返回课程路线</a></div>';status.hidden=true}else{video.src=src;const saved=courseId?readWatch()[courseId]:null;watched=Math.max(0,Number(saved?.watched)||0);video.addEventListener('loadedmetadata',()=>{if(saved?.position>0&&saved.position<video.duration-5)video.currentTime=saved.position;completeIfReady(false);renderStatus()});video.addEventListener('play',()=>{lastMediaTime=video.currentTime});video.addEventListener('seeking',()=>{lastMediaTime=video.currentTime});video.addEventListener('timeupdate',()=>{if(video.paused||video.seeking){lastMediaTime=video.currentTime;return}const now=video.currentTime,delta=lastMediaTime===null?0:now-lastMediaTime;lastMediaTime=now;if(delta>0&&delta<=3){watched+=delta;pending+=delta}if(pending>=15)flush(false);completeIfReady(false)});video.addEventListener('pause',()=>flush(true));video.addEventListener('ended',()=>{flush(true);completeIfReady(true)})}
addEventListener('pagehide',()=>flush(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)flush(true)});renderStatus();
</script></body></html>
