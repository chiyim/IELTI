<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.png" type="image/png"><link rel="apple-touch-icon" href="icon.png">
  <title>课程播放器 · IELTI</title>
  <script>document.documentElement.classList.add('ielti-booting');try{var m=localStorage.getItem('ielti_display_mode_v1')||localStorage.getItem('ielti_theme_v1')||(new Date().getHours()>=19||new Date().getHours()<7?'dark':'light');if(['light','dark','eink'].indexOf(m)>-1){document.documentElement.dataset.display=m;document.documentElement.dataset.theme=m==='dark'?'dark':'light';document.documentElement.classList.toggle('eink-mode',m==='eink');}}catch(e){}</script>
  <link rel="stylesheet" href="apple-ui.css?v=20260805-31"><link rel="stylesheet" href="eink-ui.css?v=20260728-5">
  <style>
    body{margin:0;min-height:100dvh;background:var(--apple-bg);color:var(--apple-ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.player-wrap{width:min(1120px,100%);margin:auto;padding:clamp(1rem,4vw,2.5rem)}.back{display:inline-flex;margin-bottom:1.1rem;color:var(--apple-blue);text-decoration:none;font-size:.9rem;font-weight:700}.kicker{margin:0 0 .35rem;color:var(--apple-blue);font-size:.72rem;font-weight:850;letter-spacing:.14em}.title{margin:0;font-size:clamp(1.4rem,4vw,2.35rem);letter-spacing:-.035em;line-height:1.13}.video-shell{margin-top:1rem;overflow:hidden;border:1px solid var(--apple-line);border-radius:1.4rem;background:#000;box-shadow:var(--apple-shadow)}video{display:block;width:100%;max-height:calc(100dvh - 13rem);background:#000}.status{margin:.85rem 0 0;color:var(--apple-secondary);font-size:.84rem}.status b{color:var(--apple-ink)}.error{padding:2rem;color:#fff;text-align:center}.error a{color:#8ec9ff}@media(max-width:760px){.player-wrap{padding:.8rem}.video-shell{border-radius:1rem}video{max-height:calc(100dvh - 10rem)}}
  </style>
</head>
<body class="apple-ui"><main class="player-wrap"><a class="back" href="ielts-roadmap.html">← 返回课程路线</a><p class="kicker">IELTI COURSE PLAYER</p><h1 class="title" id="title">课程视频</h1><div class="video-shell" id="shell"><video id="video" controls playsinline preload="metadata"></video></div><p class="status" id="status">学习时长会在课程勾选完成时，按视频时长计入。</p></main>
<script src="ielti-config.js?v=20260728-5"></script><script src="ielti-core.js?v=20260805-35"></script><script>
const params=new URLSearchParams(location.search),src=params.get('src'),title=params.get('title')||'课程视频',video=document.getElementById('video'),status=document.getElementById('status');document.getElementById('title').textContent=title;
if(src&&((location.protocol==='https:'&&src.startsWith('http:'))||(location.protocol==='file:'&&src.startsWith('file:')))){location.replace(src)}else if(!src){document.getElementById('shell').innerHTML='<div class="error">没有找到视频地址。<br><a href="ielts-roadmap.html">返回课程路线</a></div>';status.hidden=true}else{video.src=src}
</script></body></html>
